services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghl_theme_builder
      POSTGRES_PASSWORD: ghl_theme_builder
      POSTGRES_DB: ghl_theme_builder
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Tunnels a public HTTPS URL to the server running on the host (apps/server, via `npm run dev:server`)
  # so GHL's OAuth redirect and webhooks can reach it. Requires NGROK_AUTHTOKEN in ../.env
  # (free account at ngrok.com -> your authtoken). Get the public URL from the inspector at
  # http://localhost:4040 or `curl -s http://localhost:4040/api/tunnels`.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "4040:4040"
    command:
      - "http"
      - "host.docker.internal:${PORT:-3210}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
